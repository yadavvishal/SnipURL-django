<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #333333;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 20px;
            color: #555555;
            margin-bottom: 15px;
        }

        form input[type="url"] {
            width: calc(100% - 30px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #dddddd;
            border-radius: 5px;
            font-size: 16px;
        }

        form button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        form button:hover {
            background-color: #0056b3;
        }

        .short-url {
            margin-top: 20px;
            padding: 10px;
            background-color: #f1f8ff;
            border: 1px solid #d1e7ff;
            border-radius: 5px;
        }

        .short-url p {
            margin: 0;
            font-size: 16px;
            color: #007bff;
        }

        .short-url a {
            color: #0056b3;
            text-decoration: none;
            font-weight: bold;
        }

        .short-url a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the URL Shortener</h1>
        <!-- Form to submit the original URL -->
        <form method="post">
            <h2>Shorten Your URL</h2>
            {% csrf_token %}
            <input type="url" name="original_url" placeholder="Enter URL" required>
            <button type="submit">Shorten</button>
        </form>
        {% if short_url %}
        <!-- Display the short URL if available -->
        <div class="short-url">
            <p>Short URL: <a href="{{ short_url }}">{{ short_url }}</a></p>
        </div>
        {% endif %}
    </div>
</body>
</html>
